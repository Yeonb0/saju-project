# HOSTING-AMPLIFY (R-11): AWS Amplify Hosting 빌드 설정. 앱은 frontend/ (monorepo appRoot). 이 파일이 있으면 콘솔 빌드 설정보다 우선한다.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - node -v
            - npm install -g pnpm@10.33.0
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile --config.node-linker=hoisted
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
          - .next/cache/**/*
