services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sajuppugi_test
      POSTGRES_USER: sajuppugi_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sajuppugi_test -d sajuppugi_test']
      interval: 5s
      timeout: 3s
      retries: 10
