spring:
  application:
    name: sajuppugi-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'

app:
  member:
    consent:
      terms-version: ${TERMS_VERSION:2026-10-14}
      privacy-version: ${PRIVACY_VERSION:2026-10-14}
      # Enable only after the FE sends consent before creating the primary person.
      required-for-person-creation: ${MEMBER_CONSENT_REQUIRED_FOR_PERSON_CREATION:false}
  gift:
    orders-enabled: ${GIFT_ORDERS_ENABLED:false}
    purchases-enabled: ${GIFT_PURCHASES_ENABLED:false}
    recovery-enabled: ${GIFT_RECOVERY_ENABLED:false}
    delivery-enabled: ${GIFT_DELIVERY_ENABLED:false}
    delivery-worker-enabled: ${GIFT_DELIVERY_WORKER_ENABLED:false}
    phone-cleanup-enabled: ${GIFT_PHONE_CLEANUP_ENABLED:false}
    fulfillment-review-enabled: ${GIFT_FULFILLMENT_REVIEW_ENABLED:false}
    retention-enabled: ${GIFT_RETENTION_ENABLED:false}
    public-rate-limit-cleanup-enabled: ${GIFT_PUBLIC_RATE_LIMIT_CLEANUP_ENABLED:true}
    public-rate-limit-cleanup-delay: ${GIFT_PUBLIC_RATE_LIMIT_CLEANUP_DELAY:1h}
    payload-key: ${GIFT_PAYLOAD_KEY:}
    payload-active-key-id: ${GIFT_PAYLOAD_ACTIVE_KEY_ID:}
    payload-keyring: ${GIFT_PAYLOAD_KEYRING:{}}
    payload-reencryption-enabled: ${GIFT_PAYLOAD_REENCRYPTION_ENABLED:false}
  admin:
    enabled: ${ADMIN_OPERATIONS_ENABLED:false}
    recovery-enabled: ${ADMIN_RECOVERY_ENABLED:false}
  operations:
    alerts:
      enabled: ${OPERATIONS_ALERTS_ENABLED:false}
      adapter: ${OPERATIONS_ALERTS_ADAPTER:disabled}
      webhook-url: ${OPERATIONS_ALERTS_WEBHOOK_URL:}
      webhook-token: ${OPERATIONS_ALERTS_WEBHOOK_TOKEN:}
      stalled-after: ${OPERATIONS_ALERTS_STALLED_AFTER:15m}
  kakao-oauth:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    session-ttl: ${KAKAO_SESSION_TTL:30d}
    state-ttl: ${KAKAO_STATE_TTL:10m}
    max-active-sessions: ${KAKAO_MAX_ACTIVE_SESSIONS:5}
  person:
    encryption-key: ${PERSON_ENCRYPTION_KEY:}
  toss:
    refunds-enabled: ${TOSS_REFUNDS_ENABLED:false}
    webhooks-enabled: ${TOSS_WEBHOOKS_ENABLED:false}
    operations-enabled: ${TOSS_OPERATIONS_ENABLED:false}
    operations-scheduler:
      # Three payment workflows can make bounded provider calls without sharing Spring's default scheduler.
      pool-size: ${TOSS_OPERATIONS_SCHEDULER_POOL_SIZE:3}
    adapter: ${TOSS_ADAPTER:disabled}
    base-url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY:}
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
    read-timeout: ${TOSS_READ_TIMEOUT:10s}
    recovery:
      enabled: ${TOSS_RECOVERY_ENABLED:false}
      max-attempts: 5
      retry-delay: 30s
      lease-duration: 3m
      batch-size: 20
      poll-delay: 30s
  wallet:
    operations-enabled: ${WALLET_OPERATIONS_ENABLED:false}
    purchases-enabled: ${WALLET_PURCHASES_ENABLED:false}
    recovery:
      enabled: ${WALLET_RECOVERY_ENABLED:false}
      max-attempts: 5
      retry-delay: 30s
      batch-size: 20
      poll-delay: 30s
  reading:
    generation-context-protection:
      encryption-key: ${GENERATION_CONTEXT_ENCRYPTION_KEY:}
    generation-context-reencryption:
      enabled: ${GENERATION_CONTEXT_REENCRYPTION_ENABLED:false}
      batch-size: ${GENERATION_CONTEXT_REENCRYPTION_BATCH_SIZE:100}
    generation:
      lease-duration: ${READING_GENERATION_LEASE_DURATION:2m}
    generation-recovery:
      enabled: ${READING_GENERATION_RECOVERY_ENABLED:false}
      max-attempts: 3
      batch-size: 20
      poll-delay: 30s
  talisman:
    render:
      # Disabled until approved assets and a real private object-storage adapter are configured.
      enabled: ${TALISMAN_RENDER_ENABLED:false}
      max-attempts: ${TALISMAN_RENDER_MAX_ATTEMPTS:3}
      batch-size: ${TALISMAN_RENDER_BATCH_SIZE:10}
      poll-delay: ${TALISMAN_RENDER_POLL_DELAY:30s}
      retry-delay: ${TALISMAN_RENDER_RETRY_DELAY:1m}
      lease-duration: ${TALISMAN_RENDER_LEASE_DURATION:3m}
  liner:
    adapter: ${LINER_ADAPTER:fake}
    base-url: ${LINER_BASE_URL:https://platform.liner.com/api/v1}
    api-key: ${LINER_API_KEY:}
    model: ${LINER_MODEL:liner-mark}
    connect-timeout: ${LINER_CONNECT_TIMEOUT:3s}
    read-timeout: ${LINER_READ_TIMEOUT:30s}
    max-output-tokens: ${LINER_MAX_OUTPUT_TOKENS:8000}
    reasoning-effort: ${LINER_REASONING_EFFORT:low}
