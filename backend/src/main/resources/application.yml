spring:
  application:
    name: sajuppugi-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'

app:
  liner:
    adapter: ${LINER_ADAPTER:fake}
    base-url: ${LINER_BASE_URL:https://platform.liner.com/api/v1}
    api-key: ${LINER_API_KEY:}
    model: ${LINER_MODEL:liner-mark}
    connect-timeout: ${LINER_CONNECT_TIMEOUT:3s}
    read-timeout: ${LINER_READ_TIMEOUT:30s}
    max-output-tokens: ${LINER_MAX_OUTPUT_TOKENS:4000}
    reasoning-effort: ${LINER_REASONING_EFFORT:low}
