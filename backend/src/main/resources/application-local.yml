spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sajuppugi}
    username: ${DB_USERNAME:sajuppugi}
    password: ${DB_PASSWORD:local-development-only}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  reading:
    generation-context-protection:
      # Local-only key. Shared environments must provide a distinct GENERATION_CONTEXT_ENCRYPTION_KEY.
      encryption-key: ${GENERATION_CONTEXT_ENCRYPTION_KEY:bG9jYWwtZ2VuZXJhdGlvbi1jb250ZXh0LWtleS0wMDE=}
  person:
    # Local-only development key. Shared environments must provide PERSON_ENCRYPTION_KEY.
    encryption-key: ${PERSON_ENCRYPTION_KEY:bG9jYWwtcGVyc29uLWtleS0wMTIzNDU2Nzg5YWJjZGU=}
  liner:
    adapter: ${LINER_ADAPTER:api}
