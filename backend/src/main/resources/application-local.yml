spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sajuppugi}
    username: ${DB_USERNAME:sajuppugi}
    password: ${DB_PASSWORD:local-development-only}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  liner:
    adapter: ${LINER_ADAPTER:api}
