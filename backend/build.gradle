plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sajuppugi'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'com.github.usingsky:KoreanLunarCalendar:0.4.0'
    implementation 'cn.6tail:lunar:1.7.7'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    defaultCharacterEncoding = 'UTF-8'
}

tasks.named('jar') {
    enabled = false
}

tasks.register('exportOpenApi', Test) {
    description = 'Export the local /api/v1 OpenAPI contract for frontend type generation.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.sajuppugi.OpenApiIntegrationTest' }
    systemProperty 'openapi.export.path', file('../docs/openapi/api-v1.json').absolutePath
    defaultCharacterEncoding = 'UTF-8'
    outputs.upToDateWhen { false }
}

tasks.register('walletDemo', Test) {
    description = 'Retain a synthetic debit/refund example in the isolated local PostgreSQL test database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.sajuppugi.WalletPostgresDemoTest' }
    systemProperty 'wallet.demo.path', file('build/wallet-demo.json').absolutePath
    defaultCharacterEncoding = 'UTF-8'
    outputs.upToDateWhen { false }
    doFirst {
        if (System.getenv('TEST_DATABASE_URL') != 'jdbc:postgresql://localhost:55432/sajuppugi_test') {
            throw new GradleException('walletDemo requires the isolated localhost:55432/sajuppugi_test database.')
        }
    }
}
